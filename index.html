<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>서울태전 OKR 대시보드</title>
<style>
:root { --bg: #f6f4f0; --card: #fff; --ink: #1f1d2b; --ink2: #6b6880; --line: #e5e2ec; --brand: #585EAB; --bad: #c0392b; }
@media (prefers-color-scheme: dark) { :root { --bg: #15141c; --card: #201f2a; --ink: #eceaf3; --ink2: #a3a0b5; --line: #34323f; --brand: #8C91E0; --bad: #f19a8e; } }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
.wrap { min-height: 100%; display: grid; place-items: center; padding: 24px 16px; }
.box { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 32px 28px 26px; box-shadow: 0 12px 40px rgba(30, 20, 60, .08); }
.logo { font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
.logo span { color: var(--brand); }
.sub { margin: 6px 0 22px; font-size: 13.5px; color: var(--ink2); line-height: 1.5; }
label { display: block; font-size: 12.5px; font-weight: 700; color: var(--ink2); margin-bottom: 6px; }
input { width: 100%; font: inherit; font-size: 16px; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink); outline: none; }
input:focus { border-color: var(--brand); }
button { width: 100%; margin-top: 14px; font: inherit; font-size: 15px; font-weight: 800; padding: 12px; border: 0; border-radius: 12px; background: var(--brand); color: #fff; cursor: pointer; }
button:disabled { opacity: .6; cursor: default; }
.msg { min-height: 20px; margin-top: 10px; font-size: 13px; color: var(--bad); }
.note { margin-top: 14px; font-size: 12px; color: var(--ink2); line-height: 1.5; }
/* 11/20 관리자에게 문의(Teams 알림) */
.askb { width: auto; display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 13px; font-weight: 700; padding: 6px 12px; border-radius: 999px; border: 1.5px solid color-mix(in srgb, var(--brand) 30%, var(--line)); background: var(--card); color: var(--brand); }
.askb.hot { background: var(--brand); border-color: var(--brand); color: #fff; }
.askf { margin-top: 14px; border-top: 1px dashed var(--line); padding-top: 14px; }
.askf .h { font-weight: 800; font-size: 15px; margin-bottom: 10px; }
.one { display: flex; gap: 6px; margin-bottom: 4px; }
.one button { flex: 1; width: auto; margin: 0; font-size: 12.5px; font-weight: 700; padding: 8px 0; border-radius: 10px; border: 1.5px solid var(--line); background: var(--card); color: var(--ink2); }
.one button.on { border-color: var(--brand); color: var(--brand); background: color-mix(in srgb, var(--brand) 10%, var(--card)); }
.askf label { margin-top: 10px; }
.askf textarea { width: 100%; font: inherit; font-size: 16px; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink); outline: none; resize: vertical; min-height: 64px; }
.askf textarea:focus { border-color: var(--brand); }
.fe { font-size: 12.5px; color: var(--bad); margin-top: 4px; min-height: 0; }
.bad { border-color: var(--bad) !important; }
.row { display: flex; gap: 8px; margin-top: 12px; }
.row button { flex: 1; margin: 0; font-size: 14px; padding: 10px; border-radius: 10px; }
.row .c { background: var(--card); color: var(--ink); border: 1px solid var(--line); }
.ok { margin-top: 12px; background: color-mix(in srgb, #2fa872 14%, var(--card)); color: #1f7a49; border-radius: 10px; padding: 10px 12px; font-size: 13px; font-weight: 700; line-height: 1.5; }
@media (prefers-color-scheme: dark) { .ok { color: #7fd8a5; } }
/* 11/20 제목·안내 가운데 정렬, 문의 안내 한 줄 */
.logo, .sub { text-align: center; }
.note.one1 { text-align: center; white-space: nowrap; margin-top: 16px; }
#askb { display: flex; margin: 8px auto 0; }
</style>
</head>
<body>
<div class="wrap"><form class="box" id="f" autocomplete="on">
  <div class="logo">서울태전 <span>OKR</span> 대시보드</div>
  <p class="sub" id="sub">받으신 비밀번호를 입력해 주세요.<br>이 기기에서는 30일 동안 다시 묻지 않습니다.</p>
  <label for="pw">비밀번호</label>
  <input id="pw" type="password" autocomplete="current-password" required autofocus>
  <button id="go" type="submit">열기</button>
  <div class="msg" id="msg" role="alert"></div>
  <p class="note one1">비밀번호를 모르면 관리자에게 문의하세요.</p>
  <button type="button" class="askb" id="askb"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>관리자에게 문의</button>
  <div class="askf" id="askf" hidden>
    <div class="h">관리자에게 문의</div>
    <div class="one" id="askt" role="radiogroup" aria-label="문의 종류"><button type="button" data-v="비밀번호 분실">비밀번호 분실</button><button type="button" data-v="계속 틀림">계속 틀림</button><button type="button" data-v="화면 오류">화면 오류</button></div>
    <div class="fe" id="fe-t"></div>
    <label for="askn">이름</label>
    <input id="askn" type="text" autocomplete="name" maxlength="20" placeholder="이름을 작성해 주세요">
    <div class="fe" id="fe-n"></div>
    <label for="askm">내용 (선택)</label>
    <textarea id="askm" maxlength="200" placeholder="예) 휴대폰에서만 안 열려요"></textarea>
    <div class="note" style="margin-top:4px">※ 비밀번호는 적지 마세요.</div>
    <div class="row"><button type="button" class="c" id="askc">취소</button><button type="button" id="asks">보내기</button></div>
    <div class="fe" id="fe-s"></div>
  </div>
  <div class="ok" id="askok" hidden>✓ 관리자에게 Teams 알림을 보냈어요. 확인 후 연락드릴게요.</div>
</form></div>
